<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2A 智能体支付 · 三亚旅游规划全流程演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0a0e1a;
    color: #e2e8f0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 星空背景 */
  .stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    background:
      radial-gradient(1px 1px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 60% 70%, #88ccff, transparent),
      radial-gradient(2px 2px at 80% 20%, #fff, transparent),
      radial-gradient(1px 1px at 40% 80%, #aaccff, transparent),
      radial-gradient(1.5px 1.5px at 90% 50%, #fff, transparent),
      radial-gradient(1px 1px at 10% 60%, #ddbbff, transparent),
      radial-gradient(2px 2px at 50% 10%, #fff, transparent),
      radial-gradient(1px 1px at 30% 90%, #88ddff, transparent);
    background-size: 400px 400px;
    opacity: 0.6;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.4; } to { opacity: 0.7; } }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
    position: relative;
    z-index: 1;
  }

  /* 头部 */
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 20px;
    background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.1));
    border: 1px solid rgba(99,102,241,0.3);
    border-radius: 50px;
    font-size: 13px;
    color: #a5b4fc;
    margin-bottom: 14px;
  }
  .logo-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; box-shadow: 0 0 10px #22c55e;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  h1 {
    font-size: 30px; font-weight: 700;
    background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .subtitle {
    color: #94a3b8; font-size: 14px;
  }

  /* 主区域：三栏 */
  .main-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr 0.9fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 1200px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: rgba(15,23,42,0.8);
    border: 1px solid rgba(71,85,105,0.3);
    border-radius: 14px;
    padding: 16px;
    backdrop-filter: blur(10px);
  }
  .panel-title {
    font-size: 13px; font-weight: 600;
    color: #cbd5e1;
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(71,85,105,0.2);
  }
  .panel-title .icon {
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(99,102,241,0.15);
    border-radius: 7px;
    font-size: 13px;
  }

  /* ===== 左：对话区 ===== */
  .chat-area {
    height: 560px;
    display: flex; flex-direction: column;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding-right: 6px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 2px; }

  .msg {
    display: flex; gap: 8px;
    opacity: 0;
    transform: translateY(10px);
    animation: msgIn 0.4s ease forwards;
  }
  @keyframes msgIn { to { opacity: 1; transform: translateY(0); } }

  .msg-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .msg-travel .msg-avatar { background: linear-gradient(135deg, #06b6d4, #3b82f6); }
  .msg-user .msg-avatar { background: linear-gradient(135deg, #22c55e, #10b981); }
  .msg-vendor .msg-avatar { background: linear-gradient(135deg, #f59e0b, #ef4444); }
  .msg-system .msg-avatar { background: linear-gradient(135deg, #8b5cf6, #ec4899); }

  .msg-bubble {
    max-width: 85%;
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 12px;
    line-height: 1.55;
  }
  .msg-travel .msg-bubble {
    background: rgba(6,182,212,0.1);
    border: 1px solid rgba(6,182,212,0.2);
    border-top-left-radius: 3px;
  }
  .msg-user .msg-bubble {
    background: rgba(34,197,94,0.1);
    border: 1px solid rgba(34,197,94,0.2);
    border-top-right-radius: 3px;
  }
  .msg-vendor .msg-bubble {
    background: rgba(245,158,11,0.08);
    border: 1px solid rgba(245,158,11,0.2);
    border-top-left-radius: 3px;
    color: #fde68a;
  }
  .msg-system .msg-bubble {
    background: rgba(139,92,246,0.1);
    border: 1px solid rgba(139,92,246,0.2);
    color: #c4b5fd;
    font-size: 11px;
    padding: 6px 10px;
  }
  .msg-user { flex-direction: row-reverse; }

  .msg-name {
    font-size: 10px;
    color: #64748b;
    margin-bottom: 3px;
    font-weight: 600;
  }

  /* ===== 中：订单进度 ===== */
  .order-area {
    height: 560px;
    display: flex; flex-direction: column;
  }
  .order-list {
    flex: 1;
    display: flex; flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .order-list::-webkit-scrollbar { width: 4px; }
  .order-list::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 2px; }

  .order-card {
    padding: 12px;
    background: rgba(30,41,59,0.4);
    border: 1px solid rgba(71,85,105,0.2);
    border-radius: 10px;
    opacity: 0.4;
    transition: all 0.5s ease;
  }
  .order-card.active {
    opacity: 1;
    border-color: rgba(99,102,241,0.5);
    box-shadow: 0 0 15px rgba(99,102,241,0.12);
    background: rgba(99,102,241,0.06);
  }
  .order-card.done {
    opacity: 0.8;
    border-color: rgba(34,197,94,0.3);
  }
  .order-card.done .order-status {
    color: #4ade80;
  }
  .order-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .order-title {
    font-weight: 600; font-size: 13px;
    display: flex; align-items: center; gap: 6px;
  }
  .order-icon { font-size: 16px; }
  .order-status {
    font-size: 11px;
    color: #fbbf24;
    font-weight: 500;
    display: flex; align-items: center; gap: 4px;
  }
  .order-status .spin {
    width: 8px; height: 8px;
    border: 1.5px solid rgba(251,191,36,0.3);
    border-top-color: #fbbf24;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .order-desc {
    font-size: 11px;
    color: #94a3b8;
    line-height: 1.5;
    margin-bottom: 6px;
  }
  .order-foot {
    display: flex; justify-content: space-between;
    font-size: 11px;
    padding-top: 6px;
    border-top: 1px dashed rgba(71,85,105,0.2);
  }
  .order-price {
    font-weight: 700;
    color: #fbbf24;
  }
  .order-price.done { color: #4ade80; }
  .order-vendor {
    color: #64748b;
  }

  /* 总计 */
  .total-card {
    margin-top: 12px;
    padding: 14px;
    background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(236,72,153,0.08));
    border: 1px solid rgba(99,102,241,0.3);
    border-radius: 10px;
  }
  .total-label {
    font-size: 11px; color: #94a3b8;
    margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .total-amount {
    font-size: 24px; font-weight: 700;
    background: linear-gradient(135deg, #818cf8, #f472b6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .total-detail {
    margin-top: 8px;
    font-size: 11px;
    color: #64748b;
    display: flex; justify-content: space-between;
  }

  /* ===== 右：钱包 & 链上状态 ===== */
  .chain-area {
    height: 560px;
    display: flex; flex-direction: column;
    gap: 14px;
  }

  .wallet-card {
    padding: 16px;
    background: linear-gradient(135deg, #0ea5e9, #6366f1, #a855f7);
    border-radius: 14px;
    position: relative;
    overflow: hidden;
  }
  .wallet-card::before {
    content: "";
    position: absolute;
    top: -50%; right: -20%;
    width: 150px; height: 150px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
  }
  .wallet-card::after {
    content: "";
    position: absolute;
    bottom: -30%; left: -10%;
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .wallet-label {
    font-size: 11px; opacity: 0.85;
    margin-bottom: 4px;
    position: relative; z-index: 1;
  }
  .wallet-balance {
    font-size: 28px; font-weight: 700;
    position: relative; z-index: 1;
    transition: all 0.5s ease;
  }
  .wallet-unit { font-size: 14px; opacity: 0.8; margin-left: 3px; }
  .wallet-sub {
    margin-top: 10px;
    font-size: 10px; opacity: 0.75;
    display: flex; justify-content: space-between;
    position: relative; z-index: 1;
  }

  .tx-panel {
    flex: 1;
    background: rgba(0,0,0,0.2);
    border-radius: 10px;
    padding: 14px;
  }
  .tx-title {
    font-size: 11px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .block-visual {
    aspect-ratio: 1;
    max-width: 120px;
    margin: 0 auto 14px;
    position: relative;
  }
  .block-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px dashed rgba(99,102,241,0.2);
    animation: ringSpin 8s linear infinite;
  }
  .block-ring:nth-child(2) { inset: 12px; animation-duration: 6s; animation-direction: reverse; border-color: rgba(139,92,246,0.25); }
  .block-ring:nth-child(3) { inset: 24px; animation-duration: 4s; border-color: rgba(236,72,153,0.3); }
  @keyframes ringSpin { to { transform: rotate(360deg); } }
  .block-core {
    position: absolute;
    inset: 36px;
    background: linear-gradient(135deg, #06b6d4, #6366f1);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 20px rgba(99,102,241,0.5);
  }

  .tx-status {
    text-align: center;
    margin-bottom: 12px;
  }
  .tx-status-text {
    font-size: 14px; font-weight: 600;
    color: #fbbf24;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .tx-status-text.success { color: #4ade80; }
  .tx-status-text .spin {
    width: 12px; height: 12px;
    border: 2px solid rgba(251,191,36,0.3);
    border-top-color: #fbbf24;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  .tx-info {
    font-size: 11px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    line-height: 1.8;
  }
  .tx-info .row {
    display: flex; justify-content: space-between;
    padding: 2px 0;
  }
  .tx-info .k { color: #64748b; }
  .tx-info .v { color: #e2e8f0; }
  .tx-info .hash { color: #a5b4fc; font-size: 10px; word-break: break-all; }

  .gas-meter {
    height: 3px;
    background: rgba(71,85,105,0.3);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
  }
  .gas-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
    transition: width 0.3s;
  }

  /* ===== 底部控制 ===== */
  .control-panel {
    background: rgba(15,23,42,0.8);
    border: 1px solid rgba(71,85,105,0.3);
    border-radius: 14px;
    padding: 16px 20px;
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .btn-primary {
    padding: 12px 28px;
    background: linear-gradient(135deg, #06b6d4, #6366f1);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    display: flex; align-items: center; gap: 8px;
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(6,182,212,0.4);
  }
  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-secondary {
    padding: 10px 18px;
    background: rgba(71,85,105,0.2);
    border: 1px solid rgba(100,116,139,0.3);
    border-radius: 10px;
    color: #cbd5e1;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn-secondary:hover {
    background: rgba(71,85,105,0.4);
  }
  .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

  .progress-bar-wrap {
    flex: 1;
    min-width: 200px;
  }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 11px; color: #94a3b8;
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 6px;
    background: rgba(71,85,105,0.3);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #06b6d4, #6366f1, #ec4899);
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  .stat-chips {
    display: flex; gap: 8px;
    flex-wrap: wrap;
  }
  .stat-chip {
    padding: 6px 12px;
    background: rgba(15,23,42,0.6);
    border: 1px solid rgba(71,85,105,0.3);
    border-radius: 8px;
    font-size: 11px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .stat-chip .k { color: #64748b; }
  .stat-chip .v { color: #e2e8f0; font-weight: 600; font-size: 13px; }
</style>
</head>
<body>

<div class="stars"></div>

<div class="container">
  <!-- 头部 -->
  <div class="header">
    <div class="logo">
      <div class="logo-dot"></div>
      A2A Payment OS · Live Demo
    </div>
    <h1>🌴 三亚3日游 · AI旅行规划全流程</h1>
    <div class="subtitle">一个Agent对接6个服务商Agent，自动比价、自动下单、自动付款 — 全程无人干预</div>
  </div>

  <!-- 主区域 -->
  <div class="main-grid">

    <!-- 左：A2A对话 -->
    <div class="panel">
      <div class="panel-title">
        <div class="icon">💬</div>
        A2A 多智能体对话
      </div>
      <div class="chat-area">
        <div class="chat-messages" id="chatMessages">
          <!-- 动态插入 -->
        </div>
      </div>
    </div>

    <!-- 中：订单卡片 -->
    <div class="panel">
      <div class="panel-title">
        <div class="icon">📋</div>
        订单清单 · 6项服务
      </div>
      <div class="order-area">
        <div class="order-list" id="orderList">
          <!-- 动态插入 -->
        </div>

        <div class="total-card">
          <div class="total-label">行程总预算</div>
          <div class="total-amount" id="totalAmount">¥ 0.00</div>
          <div class="total-detail">
            <span id="paidCount">已支付 0 项</span>
            <span id="savingTip">AI议价省 ¥0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 右：钱包+交易 -->
    <div class="panel">
      <div class="panel-title">
        <div class="icon">💎</div>
        数字人民币钱包
      </div>
      <div class="chain-area">

        <div class="wallet-card">
          <div class="wallet-label">平安AI旅行·子钱包</div>
          <div class="wallet-balance" id="walletBalance">
            12,800.00 <span class="wallet-unit">元</span>
          </div>
          <div class="wallet-sub">
            <span>张小明</span>
            <span>**** **** **** 8823</span>
          </div>
        </div>

        <div class="tx-panel">
          <div class="tx-title">当前交易状态</div>
          <div class="block-visual" id="blockVisual">
            <div class="block-ring"></div>
            <div class="block-ring"></div>
            <div class="block-ring"></div>
            <div class="block-core">💠</div>
          </div>
          <div class="tx-status">
            <div class="tx-status-text" id="txStatusText">
              等待开始
            </div>
          </div>
          <div class="tx-info" id="txInfo">
            <div class="row"><span class="k">交易流水号</span><span class="v hash">—</span></div>
            <div class="row"><span class="k">付款方</span><span class="v">—</span></div>
            <div class="row"><span class="k">收款方</span><span class="v">—</span></div>
            <div class="row"><span class="k">金额</span><span class="v">—</span></div>
            <div class="row"><span class="k">节点确认</span><span class="v">— / 6</span></div>
            <div class="gas-meter"><div class="gas-fill" id="gasFill"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部控制 -->
  <div class="control-panel">
    <div class="stat-chips">
      <div class="stat-chip">
        <span class="k">参与Agent</span>
        <span class="v">7 个</span>
      </div>
      <div class="stat-chip">
        <span class="k">A2A支付笔数</span>
        <span class="v">6 笔</span>
      </div>
      <div class="stat-chip">
        <span class="k">预计耗时</span>
        <span class="v">~40 秒</span>
      </div>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-label">
        <span>规划进度</span>
        <span id="progressText">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <button class="btn-secondary" id="resetBtn">↺ 重置</button>
    <button class="btn-primary" id="startBtn">
      <span id="btnIcon">▶</span>
      <span id="btnText">开始规划</span>
    </button>
  </div>

</div>

<script>
// ===== 数据定义 =====
const orders = [
  {
    id: 1,

  },
  {

    vendor: '美食Agent·大众点评',
    originalPrice: 1200,
    price: 960,
    saving: 240,
    bargain: '预约了靠窗位+团购套餐组合',

  },
  {
    id: 5,
    icon: '🚗',
    title: '租车 3天',
    desc: '特斯拉Model 3 含保险 机场取还',
    vendor: '租车Agent·一嗨租车',
    originalPrice: 1299,
    price: 999,
    saving: 300,
    bargain: '争取到了新用户首租7折+免服务费',
    step: 5
  },
  {
    id: 6,
    icon: '🛟',
    title: '潜水体验',
    desc: '蜈支洲岛深潜一次 含教练+照片视频',
    vendor: '玩乐Agent·当地向导',
    originalPrice: 680,
    price: 580,
    saving: 100,
    bargain: '多送了一次浮潜和水下拍照',
    step: 6
  }
];

const totalOriginal = orders.reduce((s, o) => s + o.originalPrice, 0);
const totalFinal = orders.reduce((s, o) => s + o.price, 0);
const totalSaving = totalOriginal - totalFinal;

let currentOrder = 0;
let isPlaying = false;
let walletBalance = 12800;

// ===== 初始化订单列表 =====
function renderOrders() {
  const list = document.getElementById('orderList');
  list.innerHTML = orders.map(o => `
    <div class="order-card" data-order="${o.id}">
      <div class="order-head">
        <div class="order-title">
          <span class="order-icon">${o.icon}</span>
          ${o.title}
        </div>
        <div class="order-status" id="status-${o.id}">等待中</div>
      </div>
      <div class="order-desc">${o.desc}</div>
      <div class="order-foot">
        <span class="order-vendor">${o.vendor}</span>
        <span class="order-price" id="price-${o.id}">¥ ${o.price.toLocaleString()}</span>
      </div>
    </div>
  `).join('');
}

// ===== 对话消息 =====
function addMsg(type, name, text) {
  return new Promise(resolve => {
    setTimeout(() => {
      const chat = document.getElementById('chatMessages');
      const msg = document.createElement('div');
      msg.className = `msg msg-${type}`;
      const avatars = {
        travel: '🏝️',
        user: '👤',
        vendor: '🤖',
        system: '⚡'
      };
      const nameHtml = name ? `<div class="msg-name">${name}</div>` : '';
      msg.innerHTML = `
        <div class="msg-avatar">${avatars[type] || '🤖'}</div>
        <div>
          ${nameHtml}
          <div class="msg-bubble">${text}</div>
        </div>
      `;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
      resolve();
    }, 0);
  });
}

// ===== 交易状态 =====
function setTxStatus(text, spinning, success = false) {
  const el = document.getElementById('txStatusText');
  if (spinning) {
    el.innerHTML = `<span class="spin"></span>${text}`;
    el.classList.remove('success');
  } else if (success) {
    el.textContent = text;
    el.classList.add('success');
  } else {
    el.textContent = text;
    el.classList.remove('success');
  }
}

function updateTxInfo({ hash, from, to, amount, blocks, gasPct }) {
  document.getElementById('txInfo').innerHTML = `
    <div class="row"><span class="k">交易流水号</span><span class="v hash">${hash}</span></div>
    <div class="row"><span class="k">付款方</span><span class="v">${from}</span></div>
    <div class="row"><span class="k">收款方</span><span class="v">${to}</span></div>
    <div class="row"><span class="k">金额</span><span class="v">${amount}</span></div>
    <div class="row"><span class="k">节点确认</span><span class="v">${blocks}</span></div>
    <div class="gas-meter"><div class="gas-fill" id="gasFill"></div></div>
  `;
  document.getElementById('gasFill').style.width = gasPct + '%';
}

function randomHash() {
  const chars = '0123456789abcdef';
  let h = 'DC';
  for (let i = 0; i < 6; i++) h += chars[Math.floor(Math.random() * 16)];
  h += '...';
  for (let i = 0; i < 4; i++) h += chars[Math.floor(Math.random() * 16)];
  return h;
}

// ===== 订单状态更新 =====
function setOrderActive(id) {
  const card = document.querySelector(`.order-card[data-order="${id}"]`);
  if (card) {
    card.classList.add('active');
    const status = document.getElementById(`status-${id}`);
    if (status) status.innerHTML = '<span class="spin"></span>处理中';
  }
}
function setOrderDone(id) {
  const card = document.querySelector(`.order-card[data-order="${id}"]`);
  if (card) {
    card.classList.remove('active');
    card.classList.add('done');
    const status = document.getElementById(`status-${id}`);
    if (status) status.textContent = '✓ 已支付';
    const price = document.getElementById(`price-${id}`);
    if (price) price.classList.add('done');
  }
}

function updateTotal(paidCount) {
  const paid = orders.slice(0, paidCount).reduce((s, o) => s + o.price, 0);
  document.getElementById('totalAmount').textContent = '¥ ' + paid.toLocaleString() + '.00';
  document.getElementById('paidCount').textContent = `已支付 ${paidCount} / ${orders.length} 项`;
  const saved = orders.slice(0, paidCount).reduce((s, o) => s + o.saving, 0);
  document.getElementById('savingTip').textContent = `AI议价省 ¥${saved}`;
}

function updateWallet(amount) {
  walletBalance -= amount;
  document.getElementById('walletBalance').innerHTML =
    walletBalance.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) +
    ' <span class="wallet-unit">元</span>';
}

function setProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = Math.round(pct) + '%';
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ===== 主流程 =====
async function startDemo() {
  if (isPlaying) return;
  isPlaying = true;

  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  document.getElementById('btnText').textContent = '规划中...';
  document.getElementById('btnIcon').textContent = '⏱';

  const chat = document.getElementById('chatMessages');
  chat.innerHTML = '';
  walletBalance = 12800;
  document.getElementById('walletBalance').innerHTML = '12,800.00 <span class="wallet-unit">元</span>';
  setProgress(0);
  setTxStatus('等待开始', false);
  updateTxInfo({ hash: '—', from: '—', to: '—', amount: '—', blocks: '— / 6', gasPct: 0 });
  updateTotal(0);
  renderOrders();

  const totalSteps = orders.length + 4; // 开头3步 + 结尾1步
  let step = 0;

  // 1. 用户需求
  await addMsg('user', '我', '国庆后想去三亚玩3天，15号出发17号回，两个人，预算一人5000左右，帮我规划一下');
  step++; setProgress(step / totalSteps * 100);
  await sleep(800);

  // 2. Agent接单
  await addMsg('travel', '旅行规划Agent', '好的，我来为您规划三亚3日行程。先确认一下需求：\n\n✈️ 10月15日出发 / 17日返回\n👥 2人\n💰 人均预算5000元（总10000元）\n\n我现在对接各服务商Agent比价，给您出最优方案。');
  step++; setProgress(step / totalSteps * 100);
  await sleep(1200);

  // 3. 系统提示
  await addMsg('system', '', '🔄 已唤醒 6 个服务商Agent，开始并行比价与协商...');
  step++; setProgress(step / totalSteps * 100);
  await sleep(1000);

  // 逐个处理每个订单
  for (let i = 0; i < orders.length; i++) {
    const o = orders[i];

    // 点亮订单卡片
    setOrderActive(o.id);

    // 旅行Agent询价
    await addMsg('travel', '旅行规划Agent', `【${o.icon} ${o.title}】正在跟${o.vendor.split('·')[0]}谈价格...`);
    await sleep(600);

    // 服务商Agent回复
    await addMsg('vendor', o.vendor, `您好，${o.desc}，原价 ¥${o.originalPrice.toLocaleString()}，需要预订吗？`);
    await sleep(700);

    // 旅行Agent砍价
    await addMsg('travel', '旅行规划Agent', `客户是我的长期合作方，${o.bargain}，能给什么价？`);
    await sleep(600);

    // 服务商Agent同意
    await addMsg('vendor', o.vendor, `行，给到您 ¥${o.price.toLocaleString()} 协议价，这是我们的底价了。`);
    await sleep(500);

    // 旅行Agent确认并发起支付
    await addMsg('travel', '旅行规划Agent', `成交。我从数字人民币子钱包付款，确认到账后请立即锁定库存。`);
    await sleep(400);

    // === 支付流程 ===
    setTxStatus('Agent 支付意图生成', true);
    const hash = randomHash();
    updateTxInfo({
      hash: hash,
      from: '张小明·AI旅行子钱包',
      to: o.vendor,
      amount: '¥ ' + o.price.toLocaleString(),
      blocks: '0 / 6',
      gasPct: 10
    });
    await sleep(600);

    // 策略校验
    setTxStatus('智能合约规则校验中', true);
    updateTxInfo({
      hash: hash,
      from: '张小明·AI旅行子钱包',
      to: o.vendor,
      amount: '¥ ' + o.price.toLocaleString(),
      blocks: '0 / 6',
      gasPct: 25
    });
    await sleep(500);

    // 签名
    setTxStatus('国密SM2签名中', true);
    updateTxInfo({
      hash: hash,
      from: '张小明·AI旅行子钱包',
      to: o.vendor,
      amount: '¥ ' + o.price.toLocaleString(),
      blocks: '0 / 6',
      gasPct: 40
    });
    await sleep(400);

    // 节点确认动画
    setTxStatus('数币联盟链共识中', true);
    for (let j = 1; j <= 6; j++) {
      await sleep(100);
      const pct = 40 + (j / 6) * 50;
      updateTxInfo({
        hash: hash,
        from: '张小明·AI旅行子钱包',
        to: o.vendor,
        amount: '¥ ' + o.price.toLocaleString(),
        blocks: j + ' / 6',
        gasPct: pct
      });
    }

    // 支付完成
    setTxStatus('支付成功 ✓', false, true);
    updateTxInfo({
      hash: hash,
      from: '张小明·AI旅行子钱包',
      to: o.vendor,
      amount: '¥ ' + o.price.toLocaleString(),
      blocks: '6 / 6 ✓',
      gasPct: 100
    });

    setOrderDone(o.id);
    updateWallet(o.price);
    updateTotal(i + 1);
    step++;
    setProgress(step / totalSteps * 100);

    await sleep(400);

    // 服务商确认到账
    await addMsg('system', '', `✅ ${o.vendor} 确认到账，订单已锁定`);
    await sleep(300);
  }

  // 全部完成，Agent给出汇总
  await sleep(500);
  await addMsg('travel', '旅行规划Agent',
    `🎉 规划完成！6项服务全部预订成功，确认信息如下：\n\n` +
    `📅 行程：10月15-17日（3天2晚）\n` +
    `✈️ 机票：深圳→三亚往返 南航\n` +
    `🏨 酒店：亚龙湾瑞吉 海景大床含早\n` +
    `🏝️ 景点：蜈支洲岛+呀诺达+亚特兰蒂斯\n` +
    `🍽️ 餐厅：3家特色餐厅均已预约\n` +
    `🚗 租车：特斯拉Model 3 机场取还\n` +
    `🛟 体验：蜈支洲岛深潜一次\n\n` +
    `💰 <b>总花费：¥${totalFinal.toLocaleString()}</b>\n` +
    `💸 预算内，AI议价共省 <b>¥${totalSaving.toLocaleString()}</b>（省了 ${Math.round(totalSaving/totalOriginal*100)}%）\n\n` +
    `行程单稍后发您微信，出行前一天会再发提醒。祝您旅途愉快！🌴`
  );

  setProgress(100);

  // 完成
  document.getElementById('btnText').textContent = '规划完成';
  document.getElementById('btnIcon').textContent = '🌴';
  isPlaying = false;
}

// ===== 事件 =====
document.getElementById('startBtn').addEventListener('click', startDemo);
document.getElementById('resetBtn').addEventListener('click', () => {
  if (isPlaying) return;
  location.reload();
});

// 初始化
renderOrders();
updateTotal(0);
</script>
